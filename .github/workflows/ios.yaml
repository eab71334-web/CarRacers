name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o godot.zip
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          unzip -q templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          mv templates "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export Xcode project from Godot
        run: |
          mkdir -p build/ios
          GODOT="$PWD/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --import || true
          # Godot tries to build the IPA itself and fails without signing; the Xcode project is what we need.
          "$GODOT" --headless --export-release "iOS" build/ios/CarRacers.ipa || true
          ls build/ios

      - name: Build unsigned app and package IPA
        run: |
          cd build/ios
          xcodebuild -project CarRacers.xcodeproj -scheme CarRacers -configuration Release \
            -sdk iphoneos -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/CarRacers.app Payload/
          zip -qr CarRacers-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarRacers-ios-ipa-unsigned
          path: build/ios/CarRacers-unsigned.ipa
